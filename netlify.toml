[build]
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/jam-critty run build"
  publish = "artifacts/jam-critty/dist/public"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "9"

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
