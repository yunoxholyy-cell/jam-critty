services:
  - type: web
    name: jam-critty-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false   # Set this manually in Render dashboard
