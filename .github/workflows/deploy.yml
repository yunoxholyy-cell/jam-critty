name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/jam-critty run build
        env:
          VITE_API_URL: https://jam-critty-api.onrender.com

      - name: Deploy to Netlify (zip deploy)
        run: |
          cd artifacts/jam-critty/dist/public
          zip -r /tmp/deploy.zip .
          curl -X POST "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip \
            -o /tmp/deploy-result.json
          cat /tmp/deploy-result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy URL:', d.get('ssl_url') or d.get('deploy_ssl_url') or d.get('url')); print('State:', d.get('state'))"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
