name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Build frontend
        run: pnpm --filter @workspace/jam-critty run build
        env:
          VITE_API_URL: https://jam-critty-api.onrender.com

      - name: Deploy frontend to Netlify
        run: |
          cd artifacts/jam-critty/dist/public
          zip -r /tmp/frontend.zip .
          curl -sS -X POST "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/frontend.zip \
            -o /tmp/netlify-result.json
          cat /tmp/netlify-result.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Frontend:', d.get('ssl_url') or d.get('url')); print('State:', d.get('state'))"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Push built API to render-deploy branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Switch to (or create) render-deploy branch
          git checkout --orphan render-deploy-tmp
          git reset --hard

          # Copy only what Render needs to run the server
          cp -r artifacts/api-server/dist ./dist
          cp artifacts/api-server/package.json ./package.json

          # Minimal package.json for Render (just the start command)
          cat > package.json << 'EOF'
          {"name":"jam-critty-api","version":"1.0.0","type":"module","scripts":{"start":"node --enable-source-maps dist/index.mjs"}}
          EOF

          git add -A
          git commit -m "Deploy: built API $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin HEAD:render-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Render deploy
        run: |
          sleep 3
          DEPLOY=$(curl -sS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "Render deploy triggered: $(echo $DEPLOY | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("id"), d.get("status"))')"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
